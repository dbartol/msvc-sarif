on:
  workflow_dispatch:

jobs:
  my_job:
    name: Test
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Setup MSVC Developer Command Prompt
      uses: TheMrMilchmann/setup-msvc-dev@v4.0.0
      with:
        arch: x86
    - name: Compile
      run: |
        cl /c /W4 test.cpp /experimental:log test.sarif
        type test.sarif
