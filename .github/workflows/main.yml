on:
  workflow_dispatch:

jobs:
  my_job:
    name: Test
    runs-on: windows-latest
    steps:
    - name: Setup MSVC Developer Command Prompt
      uses: TheMrMilchmann/setup-msvc-dev@v4.0.0
    - name: Compile
      run: |
        cl /c /analyze test.cpp /experimental:log test.sarif
        type test.sarif
